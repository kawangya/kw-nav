<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的应用</title>
  <link rel="stylesheet" href="../css/aistyle.css">
  <style>
    :root {
      --page-shell-bg: rgba(255, 255, 255, 0.82);
      --page-shell-border: #dbe3f0;
      --page-shadow: rgba(15, 23, 42, 0.08);
      --primary: #2563eb;
      --primary-soft: #eff4ff;
      --muted: #64748b;
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: #e8edf6;
      --chip-bg: #f1f5f9;
      --shadow-soft: rgba(15, 23, 42, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      padding: 24px 14px 36px;
    }

    .page-shell {
      max-width: 960px;
      margin: 0 auto;
      background: var(--page-shell-bg);
      border: 1px solid var(--page-shell-border);
      border-radius: 18px;
      box-shadow: 0 18px 50px var(--page-shadow);
      backdrop-filter: blur(12px);
      padding: 24px 20px 28px;
    }

    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 2px solid #bfd1ff;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(1.8rem, 2.2vw, 2.2rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #0f172a;
      border: none;
      padding: 0;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 90px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #e9edf4;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .toolbar .search-wrap {
      flex: 1;
    }

    .toolbar .search-wrap input {
      width: 100%;
      height: 46px;
      padding: 11px 16px;
      border: 1.5px solid var(--page-shell-border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      color: #0f172a;
      font-size: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
    }

    .toolbar .search-wrap input::placeholder {
      color: #94a3b8;
    }

    .toolbar .search-wrap input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .btn-refresh {
      appearance: none;
      border: 1px solid var(--page-shell-border);
      background: linear-gradient(180deg, #f8fbff 0%, #edf4ff 100%);
      color: #334155;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      height: 46px;
      padding: 0 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.04);
    }

    .btn-refresh:hover {
      border-color: #bfd1ff;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.08);
    }

    .btn-refresh:active {
      transform: scale(0.98);
    }

    .btn-refresh:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-refresh.spinning .icon {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      box-shadow: 0 8px 20px var(--shadow-soft);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 60px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .app-card:hover {
      border-color: #bfd1ff;
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.08);
      transform: translateY(-2px);
    }

    .app-card .app-name {
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 1 1 auto;
    }

    .app-card .app-version {
      flex-shrink: 0;
      font-size: 12px;
      line-height: 22px;
      padding: 0 9px;
      border-radius: 999px;
      background: var(--chip-bg);
      color: var(--muted);
      font-weight: 600;
    }

    .app-card .btn-download {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 72px;
      height: 30px;
      padding: 0 12px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      text-decoration: none;
      border: 1px solid rgba(191, 209, 255, 0.7);
      transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .app-card .btn-download:hover {
      background: #dfeaff;
      text-decoration: none;
      color: #1d4ed8;
    }

    .app-card .btn-download:active {
      transform: scale(0.97);
    }

    .app-card .btn-download.downloading {
      background: #dfeaff;
      color: #1d4ed8;
      opacity: 0.8;
      pointer-events: none;
    }

    .app-card .btn-download.downloaded {
      background: #dcfce7;
      color: #15803d;
      border-color: rgba(34, 197, 94, 0.35);
      pointer-events: none;
    }

    .list-loading,
    .list-empty,
    .no-result {
      grid-column: 1 / -1;
      padding: 46px 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed #dbe3f0;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.35);
    }

    .list-loading .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #e9edf4;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    .list-empty .icon,
    .no-result .icon {
      display: block;
      font-size: 32px;
      margin-bottom: 8px;
    }

    @media (max-width: 768px) {
      .page-shell {
        padding: 20px 16px 20px;
      }

      .app-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar {
        flex-direction: column;
      }

      .toolbar .search-wrap,
      .btn-refresh {
        width: 100%;
      }

      .app-grid {
        grid-template-columns: 1fr;
      }

      .app-card {
        padding: 11px 12px;
      }

      .app-card .app-name {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <!-- ===== 标题栏 ===== -->
    <header class="header">
      <h1>📱 我的应用</h1>
      <span class="count" id="totalCount">加载中...</span>
    </header>

    <!-- ===== 工具栏 ===== -->
    <div class="toolbar">
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="🔍 搜索应用..." autocomplete="off" />
      </div>
      <button class="btn-refresh" id="refreshBtn" title="刷新应用列表">
        <span class="icon">🔄</span>
        <span class="label">刷新</span>
      </button>
    </div>

    <!-- ===== 网格列表 ===== -->
    <div class="app-grid" id="appGrid">
      <div class="list-loading">
        <div class="spinner"></div>
        <div>正在获取应用列表...</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
        'use strict';
    
        // ================================================================
        //  ⚙️  配置区
        // ================================================================
    
        const DATA_URL = '../fullbackup/update.txt';
        const BASE_URL = '../fullbackup/';
    
        // ================================================================
        //  DOM 引用
        // ================================================================
    
        const appGrid = document.getElementById('appGrid');
        const totalCount = document.getElementById('totalCount');
        const refreshBtn = document.getElementById('refreshBtn');
        const searchInput = document.getElementById('searchInput');
    
        // ================================================================
        //  状态
        // ================================================================
    
        let fullAppList = [];
        let isLoading = false;
    
        // ================================================================
        //  工具函数
        // ================================================================
    
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    
        function parseTxt(text) {
            const lines = text.split(/\r?\n/);
            const result = [];
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                if (line.endsWith(';')) {
                    line = line.slice(0, -1);
                }
                const sepIndex = line.indexOf(':');
                if (sepIndex === -1) continue;
                const name = line.slice(0, sepIndex).trim();
                const version = line.slice(sepIndex + 1).trim();
                if (name && version) {
                    result.push({ name, version });
                }
            }
            return result;
        }
    
        function getDownloadUrl(item) {
            let base = BASE_URL.trim();
            if (base && !base.endsWith('/')) {
                base += '/';
            }
            const fileName = `${item.name}_${item.version}.apk`;
            return base + encodeURIComponent(fileName);
        }
    
        // ================================================================
        //  渲染
        // ================================================================
    
        function render(list, searchKeyword) {
            const keyword = (searchKeyword || '').trim().toLowerCase();
    
            if (!list || list.length === 0) {
                appGrid.innerHTML = `
                    <div class="list-empty">
                        <span class="icon">📭</span>
                        暂无应用数据
                    </div>
                `;
                totalCount.textContent = '共 0 个';
                return;
            }
    
            let filtered = list;
            if (keyword) {
                filtered = list.filter(item =>
                    item.name.toLowerCase().includes(keyword)
                );
            }
    
            if (filtered.length === 0) {
                appGrid.innerHTML = `
                    <div class="no-result">
                        <span class="icon">🔍</span>
                        没有找到匹配的应用
                        <div style="font-size:13px; color:#b9c2d0; margin-top:4px;">试试其他关键词</div>
                    </div>
                `;
                totalCount.textContent = '共 0 个';
                return;
            }
    
            let html = '';
            for (const item of filtered) {
                const downloadUrl = getDownloadUrl(item);
                html += `
                    <div class="app-card">
                        <span class="app-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</span>
                        <span class="app-version">${escapeHtml(item.version)}</span>
                        <a class="btn-download" href="${escapeHtml(downloadUrl)}" download data-name="${escapeHtml(item.name)}">
                            ⬇ 下载
                        </a>
                    </div>
                `;
            }
    
            appGrid.innerHTML = html;
            totalCount.textContent = `共 ${filtered.length} 个`;
    
            // ===== 下载反馈 =====
            document.querySelectorAll('.app-card .btn-download').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    if (this.classList.contains('downloading') || this.classList.contains(
                        'downloaded')) {
                        return;
                    }
    
                    this.classList.add('downloading');
                    this.textContent = '⏳ 下载中...';
    
                    setTimeout(() => {
                        this.classList.remove('downloading');
                        this.classList.add('downloaded');
                        this.textContent = '✓ 已开始';
                        setTimeout(() => {
                            this.classList.remove('downloaded');
                            this.innerHTML = '⬇ 下载';
                        }, 3000);
                    }, 1500);
                });
            });
        }
    
        function renderWithFilter() {
            render(fullAppList, searchInput.value);
        }
    
        // ================================================================
        //  加载数据
        // ================================================================
    
        function showLoading() {
            appGrid.innerHTML = `
                <div class="list-loading">
                    <div class="spinner"></div>
                    <div>正在获取应用列表...</div>
                </div>
            `;
            totalCount.textContent = '加载中...';
        }
    
        function showError(message) {
            appGrid.innerHTML = `
                <div class="list-empty">
                    <span class="icon">⚠️</span>
                    ${escapeHtml(message)}
                </div>
            `;
            totalCount.textContent = '加载失败';
        }
    
        async function fetchAppList() {
            if (isLoading) return;
            isLoading = true;
            refreshBtn.classList.add('spinning');
            refreshBtn.disabled = true;
            showLoading();
    
            try {
                const response = await fetch(DATA_URL, { cache: 'no-cache' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const text = await response.text();
                const list = parseTxt(text);
                fullAppList = list;
                renderWithFilter();
            } catch (err) {
                console.error('获取应用列表失败:', err);
                showError('无法获取应用列表，请检查网络后重试');
            } finally {
                isLoading = false;
                refreshBtn.classList.remove('spinning');
                refreshBtn.disabled = false;
            }
        }
    
        // ================================================================
        //  事件绑定
        // ================================================================
    
        refreshBtn.addEventListener('click', fetchAppList);
    
        let searchTimer = null;
        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(renderWithFilter, 150);
        });
    
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                this.value = '';
                renderWithFilter();
                this.blur();
            }
        });
    
        // ================================================================
        //  启动
        // ================================================================
    
        fetchAppList();
    })();
  </script>

</body>

</html>
