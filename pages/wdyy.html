<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的应用</title>
  <style>
    :root {
      --page-bg: #f4f7ff;
      --page-bg-strong: #edf3ff;
      --panel-bg: rgba(255, 255, 255, 0.9);
      --panel-border: #dfe9f7;
      --primary: #2f5ef3;
      --primary-strong: #1f4fd6;
      --primary-soft: #edf3ff;
      --text: #1f2a37;
      --text-soft: #5f6f86;
      --muted: #8ea0b8;
      --card-bg: rgba(255, 255, 255, 0.92);
      --shadow: rgba(31, 54, 92, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, rgba(170, 196, 255, 0.55), transparent 36%),
        linear-gradient(180deg, var(--page-bg) 0%, var(--page-bg-strong) 100%);
      font-size: 15px;
      line-height: 1.7;
      font-weight: 400;
      min-height: 100vh;
      padding: 18px 14px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    a:hover {
      color: var(--primary-strong);
      text-decoration: underline;
    }

    .container {
      max-width: 880px;
      width: 100%;
      margin: 24px auto 40px;
      padding: 24px 22px 26px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: 0 18px 45px var(--shadow);
      backdrop-filter: blur(10px);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 0.6em;
      border-bottom: 2px solid #dfe9ff;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #12213d;
      letter-spacing: 0.02em;
      margin: 0;
      line-height: 1.35;
    }

    .header .count {
      font-size: 13px;
      color: var(--text-soft);
      background: var(--primary-soft);
      border: 1px solid #d9e5ff;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .toolbar .search-wrap {
      flex: 1;
      position: relative;
    }

    .toolbar .search-wrap input {
      width: 100%;
      padding: 10px 16px;
      border: 1.5px solid var(--panel-border);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text);
      background: #fff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
      height: 44px;
      box-shadow: inset 0 1px 1px rgba(15, 23, 42, 0.02);
    }

    .toolbar .search-wrap input::placeholder {
      color: var(--muted);
    }

    .toolbar .search-wrap input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(47, 94, 243, 0.12);
    }

    .btn-refresh {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid #cfe0ff;
      padding: 0 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      height: 44px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-refresh:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(47, 94, 243, 0.2);
    }

    .btn-refresh:active {
      transform: scale(0.98);
    }

    .btn-refresh:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }

    .btn-refresh .icon {
      font-size: 15px;
      line-height: 1;
    }

    .btn-refresh .label {
      font-size: 13px;
    }

    .btn-refresh.spinning .icon {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 58px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
      box-shadow: 0 1px 0 rgba(148, 163, 184, 0.08);
    }

    .app-card:hover {
      border-color: #c2d8ff;
      box-shadow: 0 12px 28px rgba(47, 94, 243, 0.08);
      transform: translateY(-1px);
    }

    .app-card .app-name {
      font-size: 14px;
      font-weight: 600;
      color: #13213d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1 1 auto;
      min-width: 0;
    }

    .app-card .app-version {
      font-size: 12px;
      color: var(--text-soft);
      background: #f3f6fb;
      border: 1px solid #edf1f7;
      padding: 0 9px;
      border-radius: 10px;
      line-height: 22px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .app-card .btn-download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid #cfe0ff;
      padding: 2px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
      line-height: 26px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: auto;
    }

    .app-card .btn-download:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 8px 18px rgba(47, 94, 243, 0.2);
      transform: translateY(-1px);
      text-decoration: none;
    }

    .app-card .btn-download:active {
      transform: scale(0.98);
    }

    .app-card .btn-download.downloading {
      background: #dbeafc;
      color: var(--primary);
      opacity: 0.75;
      pointer-events: none;
    }

    .app-card .btn-download.downloaded {
      background: #eafaf0;
      color: #1ca05d;
      border-color: #bfe9d1;
      pointer-events: none;
    }

    .list-loading,
    .list-empty,
    .no-result {
      grid-column: 1 / -1;
      padding: 46px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      background: rgba(255,255,255,0.25);
      border: 1px dashed #dfe9f7;
      border-radius: 14px;
    }

    .list-loading .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid #edf2fb;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    .list-empty .icon,
    .no-result .icon {
      display: block;
      font-size: 34px;
      margin-bottom: 8px;
    }

    @media (max-width: 768px) {
      .app-grid {
        gap: 10px;
      }

      .app-card {
        padding: 10px 12px;
        min-height: 52px;
      }

      .app-card .app-name {
        font-size: 13px;
      }

      .app-card .app-version {
        font-size: 11px;
        line-height: 20px;
        padding: 0 8px;
      }

      .app-card .btn-download {
        font-size: 11px;
        padding: 2px 12px;
        line-height: 24px;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 16px 10px 30px;
      }

      .container {
        padding: 16px;
        margin: 12px auto 28px;
      }

      .header {
        margin-bottom: 14px;
      }

      .header h1 {
        font-size: 1.5rem;
      }

      .toolbar {
        gap: 8px;
        margin-bottom: 14px;
      }

      .toolbar .search-wrap input {
        padding: 8px 14px;
        font-size: 13px;
        height: 40px;
      }

      .btn-refresh {
        height: 40px;
        padding: 0 12px;
      }

      .app-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .app-card {
        padding: 12px 14px;
        min-height: 52px;
      }

      .app-card .app-name {
        font-size: 14px;
      }

      .app-card .app-version {
        font-size: 12px;
        line-height: 22px;
        padding: 0 10px;
      }

      .app-card .btn-download {
        font-size: 12px;
        padding: 2px 14px;
        line-height: 26px;
      }
    }

    @media (max-width: 380px) {
      .app-card {
        padding: 10px 10px;
        min-height: 46px;
        gap: 6px;
      }

      .app-card .app-name {
        font-size: 12px;
      }

      .app-card .app-version {
        font-size: 10px;
        line-height: 18px;
        padding: 0 6px;
      }

      .app-card .btn-download {
        font-size: 10px;
        padding: 1px 10px;
        line-height: 22px;
      }

      .btn-refresh .label {
        display: none;
      }

      .btn-refresh {
        padding: 0 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- ===== 标题栏 ===== -->
    <header class="header">
      <h1>📱 我的应用</h1>
      <span class="count" id="totalCount">加载中...</span>
    </header>

    <!-- ===== 工具栏 ===== -->
    <div class="toolbar">
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="🔍 搜索应用..." autocomplete="off" />
      </div>
      <button class="btn-refresh" id="refreshBtn" title="刷新应用列表">
        <span class="icon">🔄</span>
        <span class="label">刷新</span>
      </button>
    </div>

    <!-- ===== 网格列表 ===== -->
    <div class="app-grid" id="appGrid">
      <div class="list-loading">
        <div class="spinner"></div>
        <div>正在获取应用列表...</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
        'use strict';
    
        // ================================================================
        //  ⚙️  配置区
        // ================================================================
    
        const DATA_URL = '../fullbackup/update.txt';
        const BASE_URL = '../fullbackup/';
    
        // ================================================================
        //  DOM 引用
        // ================================================================
    
        const appGrid = document.getElementById('appGrid');
        const totalCount = document.getElementById('totalCount');
        const refreshBtn = document.getElementById('refreshBtn');
        const searchInput = document.getElementById('searchInput');
    
        // ================================================================
        //  状态
        // ================================================================
    
        let fullAppList = [];
        let isLoading = false;
    
        // ================================================================
        //  工具函数
        // ================================================================
    
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    
        function parseTxt(text) {
            const lines = text.split(/\r?\n/);
            const result = [];
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                if (line.endsWith(';')) {
                    line = line.slice(0, -1);
                }
                const sepIndex = line.indexOf(':');
                if (sepIndex === -1) continue;
                const name = line.slice(0, sepIndex).trim();
                const version = line.slice(sepIndex + 1).trim();
                if (name && version) {
                    result.push({ name, version });
                }
            }
            return result;
        }
    
        function getDownloadUrl(item) {
            let base = BASE_URL.trim();
            if (base && !base.endsWith('/')) {
                base += '/';
            }
            const fileName = `${item.name}_${item.version}.apk`;
            return base + encodeURIComponent(fileName);
        }
    
        // ================================================================
        //  渲染
        // ================================================================
    
        function render(list, searchKeyword) {
            const keyword = (searchKeyword || '').trim().toLowerCase();
    
            if (!list || list.length === 0) {
                appGrid.innerHTML = `
                    <div class="list-empty">
                        <span class="icon">📭</span>
                        暂无应用数据
                    </div>
                `;
                totalCount.textContent = '共 0 个';
                return;
            }
    
            let filtered = list;
            if (keyword) {
                filtered = list.filter(item =>
                    item.name.toLowerCase().includes(keyword)
                );
            }
    
            if (filtered.length === 0) {
                appGrid.innerHTML = `
                    <div class="no-result">
                        <span class="icon">🔍</span>
                        没有找到匹配的应用
                        <div style="font-size:13px; color:#b9c2d0; margin-top:4px;">试试其他关键词</div>
                    </div>
                `;
                totalCount.textContent = '共 0 个';
                return;
            }
    
            let html = '';
            for (const item of filtered) {
                const downloadUrl = getDownloadUrl(item);
                html += `
                    <div class="app-card">
                        <span class="app-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</span>
                        <span class="app-version">${escapeHtml(item.version)}</span>
                        <a class="btn-download" href="${escapeHtml(downloadUrl)}" download data-name="${escapeHtml(item.name)}">
                            ⬇ 下载
                        </a>
                    </div>
                `;
            }
    
            appGrid.innerHTML = html;
            totalCount.textContent = `共 ${filtered.length} 个`;
    
            // ===== 下载反馈 =====
            document.querySelectorAll('.app-card .btn-download').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    if (this.classList.contains('downloading') || this.classList.contains(
                        'downloaded')) {
                        return;
                    }
    
                    this.classList.add('downloading');
                    this.textContent = '⏳ 下载中...';
    
                    setTimeout(() => {
                        this.classList.remove('downloading');
                        this.classList.add('downloaded');
                        this.textContent = '✓ 已开始';
                        setTimeout(() => {
                            this.classList.remove('downloaded');
                            this.innerHTML = '⬇ 下载';
                        }, 3000);
                    }, 1500);
                });
            });
        }
    
        function renderWithFilter() {
            render(fullAppList, searchInput.value);
        }
    
        // ================================================================
        //  加载数据
        // ================================================================
    
        function showLoading() {
            appGrid.innerHTML = `
                <div class="list-loading">
                    <div class="spinner"></div>
                    <div>正在获取应用列表...</div>
                </div>
            `;
            totalCount.textContent = '加载中...';
        }
    
        function showError(message) {
            appGrid.innerHTML = `
                <div class="list-empty">
                    <span class="icon">⚠️</span>
                    ${escapeHtml(message)}
                </div>
            `;
            totalCount.textContent = '加载失败';
        }
    
        async function fetchAppList() {
            if (isLoading) return;
            isLoading = true;
            refreshBtn.classList.add('spinning');
            refreshBtn.disabled = true;
            showLoading();
    
            try {
                const response = await fetch(DATA_URL, { cache: 'no-cache' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const text = await response.text();
                const list = parseTxt(text);
                fullAppList = list;
                renderWithFilter();
            } catch (err) {
                console.error('获取应用列表失败:', err);
                showError('无法获取应用列表，请检查网络后重试');
            } finally {
                isLoading = false;
                refreshBtn.classList.remove('spinning');
                refreshBtn.disabled = false;
            }
        }
    
        // ================================================================
        //  事件绑定
        // ================================================================
    
        refreshBtn.addEventListener('click', fetchAppList);
    
        let searchTimer = null;
        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(renderWithFilter, 150);
        });
    
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                this.value = '';
                renderWithFilter();
                this.blur();
            }
        });
    
        // ================================================================
        //  启动
        // ================================================================
    
        fetchAppList();
    })();
  </script>

</body>

</html>
